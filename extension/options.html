<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Betterbird MCP Bridge</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font: inherit; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; }
  #status { margin-top: 16px; padding: 8px; background: #f2f2f2; border-radius: 4px; }
  small { color: #666; }
</style>
</head>
<body>
<h1>Betterbird MCP Bridge</h1>
<label>Hub address (loopback only)
  <input id="hubUrl" placeholder="ws://127.0.0.1:8765/ext">
</label>
<label>Extension token
  <input id="token" type="password" placeholder="bbext_...">
</label>
<small>The token is generated by <code>node setup.mjs init</code> (or <code>rotate-ext</code>). The extension cannot send mail, it can only read messages and save drafts.</small>
<br>
<button id="save">Save and connect</button>
<div id="status">Status: ...</div>
<script src="options.js"></script>
</body>
</html>
